<!doctype html><title>M1 two-loop control</title>
<body><h1>Two concurrent rAF loops, one deliberately hitching</h1>
<canvas id="c" width="300" height="150"></canvas>
<script>
// Loop A: well behaved.
(function a(){ requestAnimationFrame(a); })();
// Loop B: same frame, blocks 90ms on 2% of frames (harness hitch threshold is >50ms; 50 sat exactly on the boundary) -> ground truth ~2% hitch.
let n=0;
(function b(){ n++; if (n % 50 === 0){ const s=performance.now(); while(performance.now()-s < 90){} }
  requestAnimationFrame(b); })();
</script>
