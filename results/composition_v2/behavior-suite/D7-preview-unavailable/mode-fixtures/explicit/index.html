<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Works · Equipment checkout</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><main><p class="eyebrow">North Works / Member desk</p><h1>Equipment checkout</h1><p class="help">Choose the tool you need, and let us know when it will be back.</p><section class="panel"><form id="checkout-form" novalidate><div class="field"><label for="equipment">Equipment</label><select id="equipment" name="equipment" required><option value="">Choose equipment</option><option value="sander">Orbital sander</option><option value="drill">Cordless drill</option><option value="clamps">Clamp set</option></select></div><div class="field"><label for="return-date">Return date</label><input id="return-date" type="date" name="returnDate" required></div><button type="submit">Confirm checkout</button><p id="checkout-status" role="status"></p></form></section></main></body></html>
