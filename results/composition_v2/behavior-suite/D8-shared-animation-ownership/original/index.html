<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Measure Studio</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body>
<header><p>Measure Studio · Practice room</p><h1>Find your rhythm</h1><p>Compare a steady beat and the shape of a sound.</p></header>
<nav aria-label="Instrument panels">
<button id="toggle-metronome" type="button">Hide metronome</button><button id="toggle-waveform" type="button">Hide waveform</button>
<button id="mount-metronome" type="button">Unmount metronome</button><button id="mount-waveform" type="button">Unmount waveform</button>
</nav>
<main><div id="metronome-slot"></div><div id="waveform-slot"></div><section class="notes"><h2>Practice notes</h2><p>A slow tempo helps you notice the space between beats. Adjust each instrument as you listen to your own count.</p></section></main>
</body></html>
