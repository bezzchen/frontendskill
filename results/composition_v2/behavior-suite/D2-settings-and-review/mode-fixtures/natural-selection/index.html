<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clay House · Workspace settings</title><link rel="stylesheet" href="styles.css"><script src="studio-service.js" defer></script><script src="app.js" defer></script></head><body><main><p class="eyebrow">Clay House / Member studio</p><h1 id="settings-title">Workspace settings</h1><p class="help" id="settings-help">Make this space feel like yours. Choose how we keep you in the loop.</p><section class="panel"><form id="settings-form" novalidate><div class="field"><label for="display-name">Display name</label><input id="display-name" name="displayName" value="River Studio" required maxlength="60" autocomplete="organization"></div><div class="field"><label><input id="kiln-alerts" name="kilnAlerts" type="checkbox" checked> Email me when my kiln firing is ready</label><p class="help">One message when your work is ready to collect.</p></div><div class="actions"><button type="submit" id="save-settings">Save settings</button></div><p id="save-status" role="status"></p></form></section></main></body></html>
